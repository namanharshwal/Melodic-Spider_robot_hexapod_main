TrajectoryPlannerROS:
  acc_lim_theta: 2.5
  acc_lim_x: 2.0
  acc_lim_y: 2.0
  holonomic_robot: true
  latch_xy_goal_tolerance: false
  max_vel_theta: 1.5
  max_vel_x: 1.0
  max_vel_y: 1.0
  meter_scoring: true
  min_in_place_vel_theta: 0.4
  min_vel_theta: -1.5
  min_vel_x: -1.0
  min_vel_y: -1.0
  xy_goal_tolerance: 0.15
  y_vels:
  - -1.0
  - -0.5
  - 0.5
  - 1.0
  yaw_goal_tolerance: 0.15
