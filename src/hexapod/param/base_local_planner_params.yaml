TrajectoryPlannerROS:
  acc_lim_theta: 1.5
  acc_lim_x: 1.0
  acc_lim_y: 1.0
  holonomic_robot: true
  latch_xy_goal_tolerance: false
  max_vel_theta: 0.8
  max_vel_x: 0.4
  max_vel_y: 0.4
  meter_scoring: true
  min_in_place_vel_theta: 0.3
  min_vel_theta: -0.8
  min_vel_x: -0.4
  min_vel_y: -0.4
  xy_goal_tolerance: 0.15
  y_vels:
  - -0.4
  - -0.2
  - 0.2
  - 0.4
  yaw_goal_tolerance: 0.15
